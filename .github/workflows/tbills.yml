name: Update T-bill rates
on:
  schedule: [{ cron: "30 11 * * 1-5" }] # weekdays, after the Manila close
  workflow_dispatch:
permissions: { contents: write }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/pds-tbills.mjs
        env: { PDS_KEY: "${{ secrets.PDS_KEY }}" }
      - run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add data/tbills.json; git diff --cached --quiet || (git commit -m "Update T-bill rates" && git push)
